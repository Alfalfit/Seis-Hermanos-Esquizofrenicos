<!DOCTYPE html>
<html>
<head>
    <title>Los Seis Hermanos</title>

    <style>
        /* Estilo para el botón */
        .boton-grande {
            background-color: red; /* Color de fondo */
            color: white;           /* Color del texto */
            padding: 20px 50px;     /* Tamaño del botón: más alto y ancho */
            font-size: 24px;        /* Aumentar el tamaño del texto */
            border: none;           /* Sin borde */
            border-radius: 15px;    /* Bordes redondeados */
            cursor: pointer;       /* Cambia el cursor al pasar sobre el botón */
            text-align: center;     /* Centrar el texto */
            transition: background-color 0.3s ease; /* Animación suave */
        }

        .boton-grande:hover {
            background-color: darkred; /* Cambia el color de fondo cuando el ratón pasa por encima */
        }
    </style>
</head>

<body style="background:black; color:white; text-align:center; font-family:Arial;">
